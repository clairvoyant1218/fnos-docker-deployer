name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m py_compile app/scripts/worker.py app/scripts/write_settings.py app/ui/index.cgi
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON files
        run: |
          python -m json.tool config/privilege >/dev/null
          python -m json.tool config/resource >/dev/null
          python -m json.tool app/ui/config >/dev/null
          python -m json.tool wizard/install >/dev/null
          python -m json.tool wizard/config >/dev/null
          python -m json.tool wizard/uninstall >/dev/null
